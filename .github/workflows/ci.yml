name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BASE_REF: ${{ github.base_ref || 'develop' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Install packages
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Lint (scoped to this branch's diff)
        run: bunx biome check --changed --since=origin/$BASE_REF

      - name: Unit tests (bun test)
        run: bun run test:unit

      - name: Component tests (Vitest)
        run: bun run test:components

      - name: Build
        run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Install packages
        run: bun install

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: E2E tests (Playwright, mocked network)
        run: bun run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
